trigger:
- main

pool:
  name: Default

variables:
  buildConfiguration: 'Release'

steps:

- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: 8.x

- script: dotnet clean
  displayName: Clean

- script: dotnet restore
  displayName: Restore

- script: |
    dotnet publish -c $(buildConfiguration) -o publish_output --no-restore
  displayName: Publish

- script: dir publish_output /s
  displayName: Verify output

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: 'publish_output'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Azure subscription 1(fcbc5c99-308d-47ee-9f19-c7f282444dc6)'
    appType: webAppLinux
    appName: tusweb1
    package: '$(Build.ArtifactStagingDirectory)/app.zip'
    deploymentMethod: zipDeploy