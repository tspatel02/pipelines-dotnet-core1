trigger:
- main

pool:
  name: Default   # <-- your self-hosted pool name

variables:
  buildConfiguration: 'Release'

steps:

# -------------------------------
# Install correct .NET SDK
# -------------------------------
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'

# -------------------------------
# Restore dependencies
# (NO csproj hardcoding needed)
# -------------------------------
- script: dotnet restore
  displayName: Restore dependencies

# -------------------------------
# Build project
# -------------------------------
- script: dotnet build --configuration $(buildConfiguration)
  displayName: Build project

# -------------------------------
# Publish project (IMPORTANT FIX)
# -------------------------------
- script: dotnet publish --configuration $(buildConfiguration) --output publish_output
  displayName: Publish project

# -------------------------------
# Verify output (DEBUG STEP)
# -------------------------------
- script: ls -R publish_output
  displayName: Verify publish output

# -------------------------------
# Zip published output
# -------------------------------
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: 'publish_output'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true

# -------------------------------
# Deploy to Azure Web App (Linux)
# -------------------------------
- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Azure subscription 1(fcbc5c99-308d-47ee-9f19-c7f282444dc6)'
    appType: 'webAppLinux'
    appName: 'tusweb1'
    package: '$(Build.ArtifactStagingDirectory)/app.zip'