trigger:
- main

pool:
  name: Default   # your self-hosted pool

variables:
  buildConfiguration: 'Release'

steps:

# Install correct SDK on agent
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Restore packages
- script: dotnet restore YourProject.csproj
  displayName: Restore

# Build project
- script: dotnet build YourProject.csproj --configuration $(buildConfiguration)
  displayName: Build

# Publish CORRECT project (important fix)
- script: dotnet publish YourProject.csproj -c $(buildConfiguration) -o publish_output
  displayName: Publish

# Debug output (VERY IMPORTANT CHECK)
- script: ls -R publish_output
  displayName: Verify Publish Output

# Zip output
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: 'publish_output'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true

# Deploy to Azure
- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Azure subscription 1(fcbc5c99-308d-47ee-9f19-c7f282444dc6)'
    appType: 'webAppLinux'
    appName: 'tusweb1'
    package: '$(Build.ArtifactStagingDirectory)/app.zip'